<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Externo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>DCC202 CSS Externo</h1>

        <p>
            Você pode aplicar um estilo
            <em>Externo</em>
            para um elemento usando o atributo
            <code>style</code> em um documento externo referenciado no <code>head</code> por um <code>Link.</code>
        </p>
        <dl>
            <div>
                <dt>
                    <code>color:</code>
                </dt>
                <dd>Cor do texto do elemento.</dd>
            </div>
            <div>
                <dt>
                    <code>background-color:</code>
                </dt>
                <dd>Cor do fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>

</html>
