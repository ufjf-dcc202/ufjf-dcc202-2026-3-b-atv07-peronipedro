
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS em linha</title>
</head>

<body>
    <main>
        <h1>DCC202 CSS em linha</h1>

        <p>
            Você pode aplicar um estilo
            <em style="color: orange;">em linha</em>
            para um elemento usando o atributo
            <code style="background-color: black; color: lime; text-decoration: underline;">
                style.
            </code>
        </p>

        <dl>
            <div>
                <dt>
                    <code style="background-color: black; color: lime; text-decoration: underline;">
                        color:
                    </code>
                </dt>
                <dd>Cor do texto do elemento.</dd>
            </div>

            <div>
                <dt>
                    <code style="background-color: black; color: lime; text-decoration: underline;">
                        background-color
                    </code>
                </dt>
                <dd>Cor do fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>

</html>
